name: Release

# Push a tag such as `v0.1.0` to build binaries for every platform and attach
# them, with `.sha256` checksums, to the GitHub release. Then the binaries are
# pinned in shard.json (`releases`, through a PR into staging) so `brok shard
# install` can download a verified binary instead of compiling from source, and
# the crate is published to crates.io. The Promote workflow pushes the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: brok-agent

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "$GITHUB_REF_NAME"

  build:
    needs: create-release
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-latest, container: "ubuntu:20.04", max_glibc: "2.31", features: "--features vendored-openssl", target: x86_64-unknown-linux-gnu }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { platform: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin }
          - { platform: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { platform: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Built on Ubuntu 20.04, not on the runner's newest image: a binary
      # links against the glibc it is built with and needs at least that
      # version, so ubuntu-latest binaries only ran on the newest distros.
      - name: Install the build tools (Ubuntu 20.04 container)
        if: matrix.container
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git gpg perl pkg-config
          # gh uploads the release asset
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gh
      - uses: actions/checkout@v7
        with:
          path: brok-agent
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: brok-agent
          key: ${{ matrix.target }}
      - name: Build
        working-directory: brok-agent
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features }}
      # Fails the release if the binary needs a newer glibc than promised, or
      # a libssl the machine may not have.
      - name: Check the binary's dependencies
        if: matrix.max_glibc
        working-directory: brok-agent
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/$BIN"
          needed="$(readelf -d "$bin" | grep NEEDED)"
          echo "$needed"
          if echo "$needed" | grep -E 'libssl|libcrypto'; then
            echo "::error::$BIN must not depend on the system libssl"; exit 1
          fi
          highest="$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)"
          echo "highest glibc symbol: $highest (limit ${{ matrix.max_glibc }})"
          if [ "$(printf '%s\n' "$highest" "${{ matrix.max_glibc }}" | sort -V | tail -1)" != "${{ matrix.max_glibc }}" ]; then
            echo "::error::$BIN needs glibc $highest, more than ${{ matrix.max_glibc }}"; exit 1
          fi
      - name: Package
        shell: bash
        working-directory: brok-agent
        run: |
          asset="$BIN-${{ matrix.platform }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/$BIN${{ matrix.ext }}" "$asset"
          if command -v sha256sum >/dev/null; then sha256sum "$asset" | cut -d' ' -f1 > "$asset.sha256";
          else shasum -a 256 "$asset" | cut -d' ' -f1 > "$asset.sha256"; fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Upload
        shell: bash
        working-directory: brok-agent
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  # shard.json pins the release binaries (url + sha256) so `brok shard
  # install` downloads a verified binary. With the brokspace-bot secrets this
  # opens a PR into staging that merges itself; without them it prints the
  # block to paste.
  pin-binaries:
    needs: publish
    runs-on: ubuntu-latest
    env:
      HAS_BOT: ${{ secrets.BROKSPACE_BOT_KEY != '' }}
    steps:
      - name: Bot token
        id: bot
        if: env.HAS_BOT == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BROKSPACE_BOT_ID }}
          private-key: ${{ secrets.BROKSPACE_BOT_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: staging
          token: ${{ steps.bot.outputs.token || github.token }}
      - name: The releases block
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir "$RUNNER_TEMP/assets"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          releases='{}'
          for f in "$RUNNER_TEMP"/assets/*.sha256; do
            asset="$(basename "${f%.sha256}")"; platform="${asset#$BIN-}"; platform="${platform%.exe}"
            releases=$(jq --arg p "$platform" --arg u "$base/$asset" --arg s "$(cut -d' ' -f1 "$f")" '. + {($p): {url: $u, sha256: $s}}' <<<"$releases")
          done
          jq --argjson r "$releases" '.releases = $r' shard.json > shard.json.new && mv shard.json.new shard.json
          { echo '```json'; jq '{releases}' shard.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Open the PR
        if: env.HAS_BOT == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
        run: |
          if git diff --quiet shard.json; then echo "shard.json already pins $GITHUB_REF_NAME"; exit 0; fi
          id=$(gh api "users/${BOT_SLUG}[bot]" --jq .id)
          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${id}+${BOT_SLUG}[bot]@users.noreply.github.com"
          branch="release/pin-$GITHUB_REF_NAME"
          git switch -c "$branch"
          git commit -am "chore: pin the $GITHUB_REF_NAME release binaries in shard.json"
          git push --force origin "$branch"
          url=$(gh pr create --base staging --head "$branch" --title "chore: pin the $GITHUB_REF_NAME release binaries in shard.json" \
            --body "Points \`releases\` in shard.json at the $GITHUB_REF_NAME binaries and their checksums. Opened by the Release workflow; merges itself once green.")
          gh pr merge "$url" --auto --squash

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # crates.io, once the GitHub release is out.
  crates:
    needs: publish
    uses: ./.github/workflows/publish-crate.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
