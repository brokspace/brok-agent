name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: brok-agent
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: brok-agent
      - name: Cargo.lock has no local patches
        working-directory: brok-agent
        shell: bash
        # A local polyrepo build (brokspace/.cargo/config.toml patching
        # brok-sdk) records `[[patch.unused]]`; `--locked` accepts it, but
        # `cargo publish` rewrites the file and refuses to run.
        run: |
          if grep -q '^\[\[patch' Cargo.lock; then
            echo "::error file=Cargo.lock::Cargo.lock contains a [[patch...]] entry from a local build; regenerate it without the local patch"
            exit 1
          fi
      - name: Format
        working-directory: brok-agent
        run: cargo fmt --check
      - name: Clippy
        working-directory: brok-agent
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: brok-agent
        run: cargo test --locked
