name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pushes to staging/main must finish: they fill the build cache PRs restore.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # CI builds are not incremental, and line tables are enough for backtraces:
  # both make builds and the saved caches much smaller.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: brok-agent
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' }}
          workspaces: brok-agent
      - name: Cargo.lock has no local patches
        working-directory: brok-agent
        shell: bash
        # A local polyrepo build (brokspace/.cargo/config.toml patching
        # brok-sdk) records `[[patch.unused]]`; `--locked` accepts it, but
        # `cargo publish` rewrites the file and refuses to run.
        run: |
          if grep -q '^\[\[patch' Cargo.lock; then
            echo "::error file=Cargo.lock::Cargo.lock contains a [[patch...]] entry from a local build; regenerate it without the local patch"
            exit 1
          fi
      - name: Format
        working-directory: brok-agent
        run: cargo fmt --check
      # Lints do not depend on the OS; the other systems only build and test.
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        working-directory: brok-agent
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: brok-agent
        run: cargo test --locked
