name: Publish crate

# Publishes brok-agent to crates.io from a release tag (`cargo install
# brok-agent`). Run it after the Release workflow:
#   gh workflow run publish-crate.yml -f tag=vX.Y.Z
# Needs the CARGO_REGISTRY_TOKEN secret (organization or repository).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.2.0)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set (gh secret set CARGO_REGISTRY_TOKEN --org brokspace --visibility all)"
            exit 1
          fi
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if curl -fsS -A "brokspace-release (github.com/brokspace/brok-agent)" "https://crates.io/api/v1/crates/brok-agent/$version" >/dev/null 2>&1; then
            echo "brok-agent $version is already published"
            exit 0
          fi
          cargo publish --no-verify
