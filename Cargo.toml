[package]
name = "brok-agent"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Default Brokspace system shard: git change tracking, pre-indexation review and RAG answers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brokspace/brok-agent"
homepage = "https://github.com/brokspace/brok"
readme = "README.md"
keywords = ["brokspace", "rag", "llm", "agent", "shard"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
brok-sdk = "0.1.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
globset = "0.4"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# brok-sdk is not on crates.io yet: resolve it from GitHub. Delete this
# section once it is published. Polyrepo development (../.cargo/config.toml,
# written by brok/scripts/bootstrap) overrides it with the local checkout;
# do not commit the Cargo.lock changes that produces.
[patch.crates-io]
brok-sdk = { git = "https://github.com/brokspace/brok-sdk", branch = "main" }
